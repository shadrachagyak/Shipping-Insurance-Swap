[project]
name = 'shipping-insurance-swap'
description = 'A decentralized platform for swapping shipping insurance contracts automatically'
authors = []
telemetry = true
cache_dir = '.\.cache'
requirements = []
[contracts.shipping-insurance-swap]
path = 'contracts/shipping-insurance-swap.clar'
clarity_version = 3
epoch = 3.1
[repl.analysis]
passes = ['check_checker']

[repl.analysis.check_checker]
strict = false
trusted_sender = false
trusted_caller = false
callee_filter = false

[repl.remote_data]
enabled = false
api_url = 'https://api.hiro.so'
